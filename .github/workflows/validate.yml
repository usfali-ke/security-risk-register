name: validate

# The register's policy, on every proposed change and on main (scripts/validate.py:
# required fields, separation of duties, compensating controls, expiry caps by
# severity). The ruleset requires this check before a change can merge.

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  validate:
    name: validate register
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
